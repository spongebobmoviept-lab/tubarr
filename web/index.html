<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c11">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Tubarr turns your YouTube subscriptions into a polished Plex library.">
  <title>Tubarr</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <div id="app" class="app" aria-live="off"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript><p style="padding:24px;font-family:system-ui">Tubarr needs JavaScript turned on.</p></noscript>

  <!-- No build step: plain scripts, in order. The mock (web/mock/) is only loaded when the API is unreachable. -->
  <script src="js/core.js"></script>
  <script src="js/api.js"></script>
  <script src="js/tick.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/videos.js"></script>
  <script src="js/editors.js"></script>
  <script src="js/trimarr.js"></script>
  <script src="js/views/timeline.js"></script>
  <script src="js/views/channels.js"></script>
  <script src="js/views/channel.js"></script>
  <script src="js/views/activity.js"></script>
  <script src="js/views/storage.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/trim.js"></script>
  <script src="js/views/setup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
