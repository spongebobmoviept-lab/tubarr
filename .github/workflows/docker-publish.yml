name: Publish images
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  # The same checks as CI (build, unit tests); nothing is published unless they pass.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io
      id-token: write        # sign the provenance attestation (Sigstore, via GitHub OIDC)
      attestations: write    # store the attestation
    strategy:
      matrix:
        include:
          - name: tubarr
            context: .
          - name: trimarr
            context: ./trimarr
    steps:
      # Every action is pinned to a full commit SHA (the comment names the release); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image    # registry names must be lowercase; the owner name may not be
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # "latest" follows the highest semver tag automatically (flavor latest=auto); pre-releases don't get it.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      # Signed SLSA build provenance, stored with the image. Verify with:
      #   gh attestation verify oci://ghcr.io/<owner>/<name>:<version> --owner <owner>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false   # storage records need the extra artifact-metadata permission; not used here
