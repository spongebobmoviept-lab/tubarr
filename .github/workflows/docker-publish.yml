name: Publish images
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  # The same checks as CI (build, unit tests); nothing is published unless they pass.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io
      id-token: write        # sign the provenance attestation (Sigstore, via GitHub OIDC)
      attestations: write    # store the attestation
    strategy:
      matrix:
        include:
          - name: tubarr
            context: .
          - name: trimarr
            context: ./trimarr
    steps:
      # Every action is pinned to a full commit SHA (the comment names the release); Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image    # registry names must be lowercase; the owner name may not be
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.image.outputs.name }}
          # "latest" follows the highest semver tag automatically (flavor latest=auto); pre-releases don't get it.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      # Signed SLSA build provenance, stored with the image. Verify with:
      #   gh attestation verify oci://ghcr.io/<owner>/<name>:<version> --owner <owner>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false   # storage records need the extra artifact-metadata permission; not used here
