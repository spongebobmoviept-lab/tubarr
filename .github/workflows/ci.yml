name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # docker-publish.yml runs these checks before it publishes anything
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a full commit SHA (the comment names the release); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Python syntax
        run: python -m compileall -q tubarr trimarr tests
      - name: JavaScript syntax
        run: for f in $(find web -name '*.js'); do node --check "$f"; done
      - name: Build image
        run: docker build -t tubarr:ci .
      - name: Build Trimarr image
        run: docker build -t trimarr:ci ./trimarr
      # Tests run offline, as the image's unprivileged user, bypassing the entrypoint (it checks the mounted folders).
      - name: Unit tests (inside the image)
        run: >-
          docker run --rm --network none -e TUBARR_DATA=/tmp/d -e TUBARR_ROOT=/tmp/y
          -v "$PWD/tests:/app/tests:ro" --entrypoint python tubarr:ci -m unittest discover -s tests -v
      - name: Trimarr unit tests (inside the Trimarr image)
        run: >-
          docker run --rm --network none -e TRIMARR_TOKEN=test-token-0123456789abcdef
          -v "$PWD/trimarr/tests:/app/tests:ro" --entrypoint python trimarr:ci -m unittest discover -s tests -v
